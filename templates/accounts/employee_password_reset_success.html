{% extends "base/base.html" %}
{% block page_title %}Password Reset{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-5 col-md-7">
    <div class="card" style="border-left: 4px solid var(--cf-gold);">
      <div class="card-body">

        <div class="d-flex align-items-start gap-3 mb-4">
          <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
               style="width: 48px; height: 48px; background: var(--cf-gold-soft); color: var(--cf-gold-dark); font-size: 1.3rem;">
            <i class="bi bi-key-fill"></i>
          </div>
          <div>
            <h5 class="mb-1 fw-bold" style="color: var(--cf-gold-dark);">Shown once</h5>
            <p class="text-muted small mb-0">
              Share this password with <strong>{{ username }}</strong> now — you won't see it again after leaving this page.
            </p>
          </div>
        </div>

        <div class="rounded p-3 mb-4"
             style="background: var(--cf-mist); border: 1px solid var(--border-color);">
          <dl class="row mb-0 small">
            <dt class="col-5 text-muted fw-normal">Username</dt>
            <dd class="col-7 fw-semibold"><code>{{ username }}</code></dd>

            <dt class="col-5 text-muted fw-normal">Temporary password</dt>
            <dd class="col-7 mb-0">
              <code style="background: var(--cf-gold-soft); color: var(--cf-gold-dark); padding: 2px 8px; border-radius: 4px; font-weight: 700;">
                {{ password }}
              </code>
            </dd>
          </dl>
        </div>

        <a href="{% url 'team_list' %}" class="btn btn-primary w-100">
          <i class="bi bi-arrow-left me-1"></i> Back to Team
        </a>
      </div>
    </div>
  </div>
</div>

{% endblock %}
