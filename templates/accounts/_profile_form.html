{% load static %}
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="hidden" name="form_name" value="profile">

    {% if form.non_field_errors %}
        <div class="alert alert-danger">{{ form.non_field_errors|striptags }}</div>
    {% endif %}

    {% for field in form %}
        <div class="row mb-3">
            <label for="{{ field.id_for_label }}" class="col-md-4 col-lg-3 col-form-label">{{ field.label }}</label>
            <div class="col-md-8 col-lg-9">
                {{ field }}
                {% if field.errors %}
                    <div class="invalid-feedback d-block">{{ field.errors|striptags }}</div>
                {% endif %}
                {% if field.help_text %}
                    <div class="form-text">{{ field.help_text }}</div>
                {% endif %}
            </div>
        </div>
    {% endfor %}

    <div class="text-center">
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </div>
</form>
