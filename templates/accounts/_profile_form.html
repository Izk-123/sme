{% load static %}
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <input type="hidden" name="form_name" value="profile">

  {% if form.non_field_errors %}
    <div class="alert alert-danger">{{ form.non_field_errors|striptags }}</div>
  {% endif %}

  {% for field in form %}
    <div class="row mb-3">
      <label for="{{ field.id_for_label }}" class="col-md-4 col-lg-3 col-form-label fw-semibold">
        {{ field.label }}
        {% if field.field.required %}<span class="text-danger">*</span>{% endif %}
      </label>
      <div class="col-md-8 col-lg-9">
        {{ field }}
        {% if field.errors %}
          <div class="invalid-feedback d-block"><i class="bi bi-exclamation-circle me-1"></i>{{ field.errors|striptags }}</div>
        {% endif %}
        {% if field.help_text %}
          <div class="form-text">{{ field.help_text }}</div>
        {% endif %}
      </div>
    </div>
  {% endfor %}

  <div class="text-center mt-4">
    <button type="submit" class="btn btn-primary">
      <i class="bi bi-check2-circle me-1"></i> Save changes
    </button>
  </div>
</form>
