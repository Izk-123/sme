<div class="row-item item-row d-flex align-items-center gap-2 p-2 border rounded bg-white">
    <div class="flex-grow-1">
        <select name="product" class="form-select product-select"
                hx-post="{% url 'calculate_totals' %}"
                hx-trigger="change"
                hx-target="#grand-total-wrapper"
                hx-include="closest form">
            <option value="">Select product…</option>
            {% for p in products %}
                <option value="{{ p.id }}" {% if preselected == p.id %}selected{% endif %}>
                    {{ p.name }} · MK{{ p.price }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="input-group" style="width: 120px;">
        <button class="btn btn-outline-secondary stepper-btn" type="button" data-step="-1">&minus;</button>
        <input type="number" name="quantity" class="form-control text-center" min="1" value="1"
               hx-post="{% url 'calculate_totals' %}"
               hx-trigger="change, keyup delay:400ms"
               hx-target="#grand-total-wrapper"
               hx-include="closest form">
        <button class="btn btn-outline-secondary stepper-btn" type="button" data-step="1">&plus;</button>
    </div>

    <button type="button" class="btn btn-outline-danger btn-sm"
            hx-delete="{% url 'remove_item_row' %}"
            hx-target="closest .item-row"
            hx-swap="outerHTML swap:0.15s"
            hx-on:htmx:after-swap="htmx.trigger('#recalc-trigger', 'recalc')">
        <i class="bi bi-x-lg"></i>
    </button>
</div>
