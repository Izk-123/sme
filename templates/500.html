{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Something went wrong — ChumaFlow</title>

  <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}" />
  <meta name="theme-color" content="#12A5A0" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0A2F35;
      color: #FFFFFF;
      font-family: 'DM Sans', Arial, sans-serif;
      padding: 24px;
    }
    .wrap { max-width: 520px; text-align: center; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.5px;
      margin-bottom: 36px;
      color: #FFFFFF;
      text-decoration: none;
    }
    .brand-accent { color: #F5B82E; }
    .code {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      font-size: clamp(72px, 18vw, 120px);
      line-height: 1;
      letter-spacing: -4px;
      margin: 0;
      color: #F5B82E;
    }
    .eyebrow {
      color: #9FC2C0;
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 12px;
      text-transform: uppercase;
      margin: 12px 0 8px;
    }
    h1 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      font-size: clamp(24px, 5vw, 32px);
      margin: 0 0 12px;
      letter-spacing: -0.5px;
      color: #FFFFFF;
    }
    .lede {
      font-size: 16px;
      color: #CFE3E1;
      margin: 0 0 20px;
      line-height: 1.55;
    }
    .note {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #9FC2C0;
      font-size: 13px;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 26px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
      border: 1.5px solid transparent;
      cursor: pointer;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: #F5B82E;
      color: #0A2F35;
    }
    .btn-primary:hover {
      background: #FFC94D;
      color: #0A2F35;
      box-shadow: 0 8px 22px -10px rgba(245, 184, 46, 0.7);
    }
    .btn-outline {
      background: transparent;
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.25);
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.45);
    }
  </style>
</head>
<body>

  <div class="wrap">

    <a href="/" class="brand">
      <svg width="32" height="32" viewBox="0 0 36 36" aria-hidden="true">
        <rect width="36" height="36" rx="10" fill="#12A5A0"/>
        <path d="M24.5 12A9 9 0 1 0 24.5 24" fill="none" stroke="#F5B82E" stroke-width="4" stroke-linecap="round"/>
        <path d="M13.5 19c1.6-2.4 3.2-2.4 4.8 0s3.2 2.4 4.8 0" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <span>Chuma<span class="brand-accent">Flow</span></span>
    </a>

    <p class="code">500</p>
    <p class="eyebrow">Server error</p>
    <h1>Something went wrong</h1>
    <p class="lede">
      We hit an unexpected error on our end. Our team has been notified.
      Your data is safe — try again in a moment.
    </p>

    <div class="note">
      <i class="bi bi-shield-check"></i>
      <span>No changes were lost</span>
    </div>

    <div class="actions">
      <a href="/" class="btn btn-primary">
        <i class="bi bi-arrow-clockwise"></i> Try again
      </a>
      <a href="mailto:support@pritechmw.com" class="btn btn-outline">
        <i class="bi bi-life-preserver"></i> Contact support
      </a>
    </div>

  </div>

</body>
</html>
