{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Page not found — ChumaFlow</title>

  <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}" />
  <meta name="theme-color" content="#12A5A0" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      color: #0A2F35;
      font-family: 'DM Sans', Arial, sans-serif;
      padding: 24px;
    }
    .wrap { max-width: 480px; text-align: center; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.5px;
      margin-bottom: 36px;
      color: #0A2F35;
      text-decoration: none;
    }
    .brand-accent { color: #12A5A0; }
    .code {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      font-size: clamp(72px, 18vw, 120px);
      line-height: 1;
      letter-spacing: -4px;
      margin: 0;
      background: linear-gradient(135deg, #12A5A0 0%, #F5B82E 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .eyebrow {
      color: #F5B82E;
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 12px;
      text-transform: uppercase;
      margin: 12px 0 8px;
    }
    h1 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      font-size: clamp(24px, 5vw, 32px);
      margin: 0 0 12px;
      letter-spacing: -0.5px;
    }
    .lede {
      font-size: 16px;
      color: #3F5A5D;
      margin: 0 0 32px;
      line-height: 1.55;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 26px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
      border: 1.5px solid transparent;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: #12A5A0;
      color: #FFFFFF;
    }
    .btn-primary:hover {
      background: #0E7C78;
      color: #FFFFFF;
      box-shadow: 0 8px 22px -10px rgba(18, 165, 160, 0.6);
    }
    .btn-outline {
      background: transparent;
      color: #0A2F35;
      border-color: #D6E5E3;
    }
    .btn-outline:hover {
      background: #EEF6F5;
      color: #0A2F35;
      border-color: #12A5A0;
    }
  </style>
</head>
<body>

  <div class="wrap">

    <a href="/" class="brand">
      <svg width="32" height="32" viewBox="0 0 36 36" aria-hidden="true">
        <rect width="36" height="36" rx="10" fill="#12A5A0"/>
        <path d="M24.5 12A9 9 0 1 0 24.5 24" fill="none" stroke="#F5B82E" stroke-width="4" stroke-linecap="round"/>
        <path d="M13.5 19c1.6-2.4 3.2-2.4 4.8 0s3.2 2.4 4.8 0" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <span>Chuma<span class="brand-accent">Flow</span></span>
    </a>

    <p class="code">404</p>
    <p class="eyebrow">Page not found</p>
    <h1>We couldn't find that page</h1>
    <p class="lede">
      The link might be broken, or the page may have moved.
      Let's get you back to something useful.
    </p>

    <div class="actions">
      <a href="/" class="btn btn-primary">
        <i class="bi bi-house-door"></i> Go to dashboard
      </a>
      <a href="javascript:history.back()" class="btn btn-outline">
        <i class="bi bi-arrow-left"></i> Go back
      </a>
    </div>

  </div>

</body>
</html>
