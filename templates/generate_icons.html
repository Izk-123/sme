<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generate PWA Icons</title>
</head>
<body style="text-align:center; font-family: sans-serif; padding: 20px;">
    <h2>Right-click each image and "Save image as..."</h2>
    <p>Save as <code>icon-192x192.png</code> and <code>icon-512x512.png</code> in your <code>static/</code> folder.</p>
    
    <div style="display:inline-block; background:#0d6efd; border-radius:20px; padding:20px; color:white; margin:10px;">
        <svg width="192" height="192" viewBox="0 0 192 192">
            <rect width="192" height="192" rx="40" fill="#0d6efd"/>
            <text x="96" y="116" font-size="60" font-weight="bold" fill="white" text-anchor="middle">SME</text>
        </svg>
        <br><strong>192x192</strong>
    </div>
    
    <div style="display:inline-block; background:#0d6efd; border-radius:20px; padding:20px; color:white; margin:10px;">
        <svg width="512" height="512" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="80" fill="#0d6efd"/>
            <text x="256" y="316" font-size="160" font-weight="bold" fill="white" text-anchor="middle">SME</text>
        </svg>
        <br><strong>512x512</strong>
    </div>
</body>
</html>
