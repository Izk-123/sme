<div class="row g-4">
  <!-- Today's Sales -->
  <div class="col-md-3">
    <div class="card h-100 border-0 shadow-sm">
      <div class="card-body text-center">
        <h6 class="text-uppercase small fw-semibold" style="color: var(--text-muted);">Today's Sales</h6>
        <h3 class="mb-0" style="color: var(--cf-flow-teal); font-family: 'Nunito', sans-serif; font-weight: 700;">
          MK{{ today_sales|floatformat:0 }}
        </h3>
      </div>
    </div>
  </div>

  <!-- Today's Expenses -->
  <div class="col-md-3">
    <div class="card h-100 border-0 shadow-sm">
      <div class="card-body text-center">
        <h6 class="text-uppercase small fw-semibold" style="color: var(--text-muted);">Today's Expenses</h6>
        <h3 class="mb-0 text-danger" style="font-family: 'Nunito', sans-serif; font-weight: 700;">
          MK{{ today_expenses|floatformat:0 }}
        </h3>
      </div>
    </div>
  </div>

  <!-- Gross Profit -->
  <div class="col-md-3">
    <div class="card h-100 border-0 shadow-sm">
      <div class="card-body text-center">
        <h6 class="text-uppercase small fw-semibold" style="color: var(--text-muted);">Gross Profit</h6>
        <h3 class="mb-0 {% if gross_profit >= 0 %}{% else %}text-danger{% endif %}"
            style="{% if gross_profit >= 0 %}color: var(--cf-deep-teal);{% endif %} font-family: 'Nunito', sans-serif; font-weight: 700;">
          MK{{ gross_profit|floatformat:0 }}
        </h3>
      </div>
    </div>
  </div>

  <!-- Stock Value -->
  <div class="col-md-3">
    <div class="card h-100 border-0 shadow-sm">
      <div class="card-body text-center">
        <h6 class="text-uppercase small fw-semibold" style="color: var(--text-muted);">Stock Value</h6>
        <h3 class="mb-0" style="color: var(--cf-gold-dark); font-family: 'Nunito', sans-serif; font-weight: 700;">
          MK{{ stock_value|floatformat:0 }}
        </h3>
      </div>
    </div>
  </div>
</div>
