<div class="list-group list-group-flush">
  <a href="{% url 'record_sale' %}" class="list-group-item list-group-item-action py-3 d-flex align-items-center">
    <i class="bi bi-cash-coin me-3" style="color: var(--cf-flow-teal); font-size: 1.15rem;"></i>
    <span class="fw-semibold">Record Sale</span>
    <i class="bi bi-chevron-right ms-auto text-muted small"></i>
  </a>
  <a href="{% url 'expense_add' %}" class="list-group-item list-group-item-action py-3 d-flex align-items-center">
    <i class="bi bi-currency-dollar me-3" style="color: var(--cf-gold-dark); font-size: 1.15rem;"></i>
    <span class="fw-semibold">Record Expense</span>
    <i class="bi bi-chevron-right ms-auto text-muted small"></i>
  </a>
  <a href="{% url 'receive_stock' %}" class="list-group-item list-group-item-action py-3 d-flex align-items-center">
    <i class="bi bi-box-seam me-3 text-success" style="font-size: 1.15rem;"></i>
    <span class="fw-semibold">Receive Stock</span>
    <i class="bi bi-chevron-right ms-auto text-muted small"></i>
  </a>
  <a href="{% url 'payment_add' %}" class="list-group-item list-group-item-action py-3 d-flex align-items-center">
    <i class="bi bi-credit-card me-3 text-info" style="font-size: 1.15rem;"></i>
    <span class="fw-semibold">Record Payment</span>
    <i class="bi bi-chevron-right ms-auto text-muted small"></i>
  </a>
  <a href="{% url 'customer_add' %}" class="list-group-item list-group-item-action py-3 d-flex align-items-center">
    <i class="bi bi-person-plus me-3" style="color: var(--cf-flow-teal); font-size: 1.15rem;"></i>
    <span class="fw-semibold">Add Customer</span>
    <i class="bi bi-chevron-right ms-auto text-muted small"></i>
  </a>
  <a href="{% url 'supplier_add' %}" class="list-group-item list-group-item-action py-3 d-flex align-items-center">
    <i class="bi bi-truck me-3 text-secondary" style="font-size: 1.15rem;"></i>
    <span class="fw-semibold">Add Supplier</span>
    <i class="bi bi-chevron-right ms-auto text-muted small"></i>
  </a>
</div>
