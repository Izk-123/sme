<div id="step-3">
    <h4 class="card-title mb-3">What would you like to manage?</h4>
    <p class="text-muted mb-4">Select the modules you need. You can change this later.</p>
    <form hx-post="{% url 'onboarding_step' step=3 %}" hx-target="#wizard-container" hx-swap="innerHTML">
        {% csrf_token %}
        <div class="mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="modules" value="sales" id="mod-sales" checked>
                <label class="form-check-label" for="mod-sales">Sales</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="modules" value="inventory" id="mod-inventory" checked>
                <label class="form-check-label" for="mod-inventory">Inventory</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="modules" value="expenses" id="mod-expenses" checked>
                <label class="form-check-label" for="mod-expenses">Expenses</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="modules" value="customers" id="mod-customers" checked>
                <label class="form-check-label" for="mod-customers">Customers</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="modules" value="suppliers" id="mod-suppliers" checked>
                <label class="form-check-label" for="mod-suppliers">Suppliers</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="modules" value="reports" id="mod-reports" checked>
                <label class="form-check-label" for="mod-reports">Reports & Analytics</label>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Next</button>
    </form>
</div>
