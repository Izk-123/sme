<div id="step-4">
  <div class="d-flex align-items-center gap-3 mb-1">
    <span class="badge rounded-pill" style="background: var(--cf-gold-soft); color: var(--cf-deep-teal); font-weight: 700;">Step 4</span>
    <h4 class="mb-0 fw-bold">Add your team <span class="text-muted fw-normal small">(optional)</span></h4>
  </div>
  <p class="text-muted mb-4">You can invite employees later from the Team page too.</p>

  <div class="alert alert-info d-flex align-items-start gap-2 py-2 small mb-4">
    <i class="bi bi-info-circle-fill mt-1"></i>
    <div>This creates a shareable invite link — your employee picks their own username and password when they open it.</div>
  </div>

  <form hx-post="{% url 'onboarding_step' step=4 %}" hx-target="#wizard-container" hx-swap="innerHTML">
    {% csrf_token %}
    <div class="mb-3">
      <label for="id_full_name" class="form-label fw-semibold">Employee name</label>
      <input id="id_full_name" type="text" name="full_name" class="form-control" placeholder="e.g. John Banda">
    </div>
    <div class="mb-3">
      <label for="id_phone_number" class="form-label fw-semibold">Phone number</label>
      <input id="id_phone_number" type="tel" name="phone_number" class="form-control" placeholder="e.g. 099 XXX XXXX">
    </div>
    <div class="mb-3">
      <label for="id_email" class="form-label fw-semibold">Email <span class="text-muted fw-normal small">(optional)</span></label>
      <input id="id_email" type="email" name="email" class="form-control" placeholder="e.g. john@example.com">
    </div>
    <div class="mb-4">
      <label for="id_role" class="form-label fw-semibold">Role</label>
      <select id="id_role" name="role" class="form-select">
        <option value="cashier">Cashier</option>
        <option value="stock_clerk">Stock Clerk</option>
        <option value="accountant">Accountant</option>
      </select>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary btn-lg flex-grow-1 fw-bold">
        Create Invite <i class="bi bi-arrow-right ms-2"></i>
      </button>
      <a href="{% url 'onboarding_step' step=5 %}" class="btn btn-outline-secondary btn-lg">Skip</a>
    </div>
  </form>
</div>
