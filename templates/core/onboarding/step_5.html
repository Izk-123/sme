<div id="step-5" class="text-center">
  <div class="d-flex justify-content-center mb-3">
    <div class="rounded-circle d-flex align-items-center justify-content-center"
         style="width: 72px; height: 72px; background: var(--cf-gold-soft); color: var(--cf-gold-dark); font-size: 2rem;">
      <i class="bi bi-check2-circle"></i>
    </div>
  </div>
  <h4 class="fw-bold mb-2">You're all set! 🎉</h4>
  <p class="text-muted mb-4">Your business is ready to go. Start managing your sales, stock, and more.</p>

  {% if invite_link %}
    <div class="alert alert-warning text-start" style="background: var(--cf-gold-soft); border-color: var(--cf-gold); color: var(--cf-deep-teal);">
      <strong><i class="bi bi-exclamation-triangle-fill me-1"></i>Invite link created</strong>
      <div class="small mb-2">Copy it now — it's only shown once here.</div>
      <div class="input-group">
        <input type="text" class="form-control" id="onboardingInviteLink" value="{{ invite_link }}" readonly>
        <button class="btn btn-outline-secondary" type="button"
                onclick="navigator.clipboard.writeText(document.getElementById('onboardingInviteLink').value)">
          <i class="bi bi-clipboard"></i> Copy
        </button>
      </div>
    </div>
  {% endif %}

  <a href="{% url 'home' %}" class="btn btn-primary btn-lg w-100 fw-bold">
    Go to Dashboard <i class="bi bi-arrow-right ms-2"></i>
  </a>
</div>
