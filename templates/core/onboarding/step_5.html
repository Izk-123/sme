<div id="step-5">
    <h4 class="card-title mb-3">You're all set! 🎉</h4>
    <p class="text-muted mb-4">Your business is ready to go. Start managing your sales, stock, and more.</p>

    {% if invite_link %}
        <div class="alert alert-warning">
            <strong>Invite link created - copy it now, it's only shown once here:</strong>
            <div class="input-group mt-2">
                <input type="text" class="form-control" id="onboardingInviteLink" value="{{ invite_link }}" readonly>
                <button class="btn btn-outline-secondary" type="button" onclick="navigator.clipboard.writeText(document.getElementById('onboardingInviteLink').value)">
                    <i class="bi bi-clipboard"></i> Copy
                </button>
            </div>
        </div>
    {% endif %}

    <a href="{% url 'home' %}" class="btn btn-primary w-100">Go to Dashboard</a>
</div>
