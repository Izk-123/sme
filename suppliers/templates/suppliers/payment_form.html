{% extends "base/base.html" %}
{% block page_title %}Record Supplier Payment{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="fw-bold mb-3"><i class="bi bi-cash-coin me-1"></i> Record Payment</h5>
        <form method="post" novalidate>
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label for="{{ field.id_for_label }}" class="form-label fw-semibold">
                {{ field.label }}{% if field.field.required %}<span class="text-danger">*</span>{% endif %}
              </label>
              {{ field }}
              {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
              {% endif %}
            </div>
          {% endfor %}
          <div class="d-flex gap-2 mt-4">
            <button class="btn btn-primary flex-grow-1">
              <i class="bi bi-check2-circle me-1"></i> Save Payment
            </button>
            <a href="{% url 'supplier_payment_list' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
